<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The AI Timeline</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <h1 class="header__title">The AI Timeline</h1>
            <p class="header__subtitle">Major Events in the AI Space Since 2020</p>
        </div>
    </header>

    <!-- Main Content -->
    <main>
        <!-- Filter Buttons -->
        <div class="filter-section">
            <div class="container">
                <div class="filter-buttons" id="filterButtons"></div>
            </div>
        </div>

        <!-- Timeline -->
        <div class="timeline-container">
            <div class="container">
                <div class="timeline" id="timeline"></div>
            </div>
        </div>
    </main>

    <!-- Modal -->
    <div class="modal" id="eventModal">
        <div class="modal__content">
            <button class="modal__close" id="modalClose">&times;</button>
            <div class="modal__header">
                <h2 class="modal__title" id="modalTitle"></h2>
                <div class="modal__meta">
                    <span class="modal__date" id="modalDate"></span>
                    <span class="modal__category" id="modalCategory"></span>
                </div>
            </div>
            <div class="modal__body">
                <p class="modal__description" id="modalDescription"></p>
                <div class="modal__impact">
                    <h4>Impact</h4>
                    <p class="modal__impact-text" id="modalImpact"></p>
                </div>
                <div class="modal__sources">
                    <h4>Sources</h4>
                    <ul class="modal__sources-list" id="modalSources"></ul>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>Last updated: 24 October 2025</p>
            <p><a href="info.html" class="footer__link">Info &amp; Contact</a></p>
        </div>
    </footer>

    <script src="app.js"></script>
</body>
</html>
